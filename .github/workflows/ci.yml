name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (py${{ matrix.python }}${{ matrix.deps == 'lowest' && ', lowest deps' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            deps: lowest
          - python: "3.11"
          - python: "3.12"
          - python: "3.13"

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      CELERY_ADAPTIVE_TEST_REDIS_URL: redis://localhost:6379/15
      CELERY_ADAPTIVE_TEST_AMQP_URL: amqp://guest:guest@localhost:5672//
      CELERY_ADAPTIVE_TEST_RABBITMQ_API: http://localhost:15672

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pin lowest supported versions
        if: matrix.deps == 'lowest'
        run: pip install "celery==5.3.*" "kombu==5.3.*" "redis==5.0.*" "django==4.2.*"
      - run: pip freeze | grep -iE "^(celery|kombu|redis|django|fastapi)=="
      - name: Test
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test the wheel without extras
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install dist/*.whl
          /tmp/bare/bin/python -c "import celery_adaptive, celery_adaptive.tasks, celery_adaptive.cli; print(celery_adaptive.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
